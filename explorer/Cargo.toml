[package]
name = "elite-explorer"
version = "0.1.0"
edition = "2024"
description = "A 320x200 pixel galaxy explorer for the Elite universe generator"
publish = false

[[bin]]
name = "explorer"
path = "src/main.rs"

[dependencies]
elite = { path = ".." }
game-toolkit = "0.10"
font8x8 = { version = "0.3", default-features = false }
env_logger = "0.11"

[dev-dependencies]
png = "0.18"
