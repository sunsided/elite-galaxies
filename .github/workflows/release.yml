# On a version tag (v1.2.3): build the explorer for the browser, attest its build provenance
# and attach it to a GitHub release for that tag, with SHA256SUMS.
#
# game-toolkit.dev embeds that zip, pinned by SHA-256, after checking the attestation:
#   gh attestation verify elite-explorer-<tag>-web.zip --repo sunsided/elite-galaxies
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: 0.22.1

jobs:
  release:
    name: Web build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestations
      attestations: write # store the provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: trunk@${{ env.TRUNK_VERSION }}

      - name: Build
        working-directory: explorer
        run: trunk build --release --locked

      - name: Package
        run: |
          mkdir out
          (cd target/web && zip -r -9 "../../out/elite-explorer-${GITHUB_REF_NAME}-web.zip" .)
          (cd out && sha256sum -- * > SHA256SUMS)

      # The zip, and the files inside it, so an unpacked build verifies too.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.zip
            target/web/explorer_bg.wasm
            target/web/explorer.js

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Elite Galaxy Explorer $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
